# Only deploy after selecting the intended project and confirming paid hosting.
services:
  - type: web
    name: deutsch-garden
    runtime: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health
    disk:
      name: garden-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SERVER_STORAGE
        value: local
      - key: SERVER_LOCAL_DISK_CONFIRMED
        value: "true"
      - key: LUMI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: LUMI_ACCESS_PASSWORD
        sync: false
      - key: LUMI_SESSION_SECRET
        generateValue: true
      - key: LUMI_APP_ORIGIN
        sync: false
      - key: ACCOUNT_APP_ORIGIN
        sync: false
      - key: BIRTHDAY_CREATOR_PASSWORD
        sync: false
